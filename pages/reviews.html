<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Reviews - SkyBound</title>
        <link rel="stylesheet" href="../assets/css/common.css">
        <link rel="stylesheet" href="../assets/css/reviews.css">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <header class="site-header" data-purpose="site-header">
            <nav aria-label="Top" class="container">
                <div class="nav-wrapper">
                    <div class="logo-container">
                        <a class="logo-link" href="../index.html">
                        <img class="logo-icon" src="../assets/images/skybound_logo.png" alt="SkyBound"><span class="logo-text"><span class="logo-sky">Sky</span> Bound</span>
                        </a>
                    </div>
                    <div class="desktop-nav">
                        <a class="nav-link" href="../index.html">Home</a>
                        <a class="nav-link" href="search.html">Flights</a>
                        <a class="nav-link" href="#">Contact</a>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="reviews-page-section">
                <div class="container">
                    <div class="reviews-page-header">
                        <h1 class="reviews-page-title">What Travelers Say</h1>
                        <p class="reviews-page-subtitle">Real reviews from verified SkyBound travelers</p>
                    </div>

                    <div class="reviews-page-stats" id="reviews-stats">
                        <span class="reviews-avg-badge">★ ...</span>
                        <span class="reviews-count">Loading...</span>
                    </div>

                    <div class="reviews-grid" id="reviews-container">
                        <div style="text-align:center; padding:2rem; color:#6B7280;">Loading reviews...</div>
                    </div>

                    <div class="reviews-pagination" id="reviews-pagination"></div>
                </div>
            </section>
        </main>

        <footer class="site-footer" data-purpose="site-footer">
            <div class="container footer-container">
                <div class="footer-links">
                    <span class="footer-link">Privacy Policy</span>
                    <span class="footer-link">Terms of Service</span>
                </div>
                <div class="footer-copyright-wrapper">
                    <p class="footer-copyright">© 2023 SkyBound Airline Systems. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="../assets/js/auth.js"></script>
        <script src="../assets/js/reviews.js"></script>
    </body>
</html>
