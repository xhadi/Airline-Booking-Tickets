<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>My Profile - SkyBound</title>
        <!-- Common styles -->
        <link rel="stylesheet" href="../assets/css/common.css">
        <!-- Page-specific styles -->
        <link rel="stylesheet" href="../assets/css/profile.css">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    </head>
    <body>
        <!-- BEGIN: MainHeader -->
        <header class="site-header" data-purpose="site-header">
            <nav aria-label="Top" class="container">
                <div class="nav-wrapper">
                    <div class="logo-container">
                        <a class="logo-link" href="../index.html">
                            <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.13a1.503 1.503 0 01-1.5 0l-7.97-4.13c-.32-.17-.53-.5-.53-.88V7.5c0-.38.21-.71.53-.88l7.97-4.13a1.503 1.503 0 011.5 0l7.97 4.13c.32.17.53.5.53.88v9z"></path>
                            </svg>
                            <span class="logo-text">SkyBound</span>
                        </a>
                    </div>
                    <div class="desktop-nav">
                        <a class="nav-link" href="../index.html">Home</a>
                        <a class="nav-link" href="#">Flights</a>
                        <a class="nav-link" href="#">Contact</a>
                    </div>
                    <div class="mobile-menu-container">
                        <button class="mobile-menu-btn" data-purpose="mobile-menu-toggle" type="button">
                            <span class="sr-only">Open menu</span>
                            <svg style="height: 1.5rem; width: 1.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>
        </header>
        <!-- END: MainHeader -->

        <main>
            <!-- Profile Header -->
            <section class="profile-header-section">
                <div class="container">
                    <div class="profile-header-card">
                        <div class="profile-avatar-area">
                            <div class="profile-avatar">
                                <span class="material-symbols-outlined profile-avatar-icon">person</span>
                            </div>
                            <div class="profile-identity">
                                <h1 class="profile-name" id="profile-name">Loading...</h1>
                                <p class="profile-email" id="profile-email">Loading...</p>
                                <p class="profile-member-since" id="profile-member-since">Loading...</p>
                            </div>
                        </div>
                        <div class="profile-stats">
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="stat-flights">0</span>
                                <span class="profile-stat-label">Total Flights</span>
                            </div>
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="stat-spent">0</span>
                                <span class="profile-stat-label">Total Spent</span>
                            </div>
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="stat-passengers">0</span>
                                <span class="profile-stat-label">Total Passengers</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Profile Content -->
            <section class="profile-content-section">
                <div class="container">
                    <div class="profile-content">
                        <div class="profile-section">
                            <div class="section-header">
                                <h2 class="section-title">My Bookings</h2>
                            </div>
                            <div id="bookings-container" class="bookings-list">
                                <div style="text-align:center; padding: 2rem; color: #6B7280;">Loading bookings...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- BEGIN: Footer -->
        <footer class="site-footer" data-purpose="site-footer">
            <div class="container footer-container">
                <div class="footer-links">
                    <span class="footer-link">Privacy Policy</span>
                    <span class="footer-link">Terms of Service</span>
                </div>
                <div class="footer-copyright-wrapper">
                    <p class="footer-copyright">
                        © 2023 SkyBound Airline Systems. All rights reserved.
                    </p>
                </div>
            </div>
        </footer>
        <!-- END: Footer -->
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/profile.js"></script>
</body>
</html>
