<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register - SkyBound</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
    <style>
        .iti { width: 100%; } /* Ensure the input spans the full width of the group */
    </style>
</head>
<body class="auth-page-body">

    <div class="auth-split-form">
        <div class="auth-form-wrapper">
            <!-- Brand Logo -->
            <a href="../index.html" class="auth-brand">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span>SkyBound</span>
            </a>

            <h1 class="auth-title">Create an account</h1>
            <p class="auth-subtitle">Please enter your details to sign up.</p>

            <!-- Error message container (ID preserved for JS) -->
            <div id="register-error" class="auth-error-msg" style="display: none;"></div>

            <!-- Form (ID preserved for JS) -->
            <form id="register-form" class="auth-form">
                
                <div style="display: flex; gap: 1rem;">
                    <div class="auth-input-group" style="flex: 1;">
                        <label for="first-name" class="auth-label">First Name</label>
                        <input type="text" id="first-name" class="auth-input" placeholder="First Name" required>
                    </div>

                    <div class="auth-input-group" style="flex: 1;">
                        <label for="last-name" class="auth-label">Last Name</label>
                        <input type="text" id="last-name" class="auth-input" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label for="email" class="auth-label">Email address</label>
                    <input type="email" id="email" class="auth-input" placeholder="Enter your email" required>
                </div>

                <div class="auth-input-group">
                    <label for="phone-number" class="auth-label">Phone Number (Optional)</label>
                    <input type="tel" id="phone-number" name="phone" class="auth-input" placeholder="556815809">
                </div>

                <div class="auth-input-group">
                    <label for="password" class="auth-label">Password</label>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required minlength="8">
                </div>

                <button type="submit" class="btn-auth">Register</button>
            </form>

            <p class="auth-footer-link">
                Already have an account? <a href="login.html">Sign in here</a>
            </p>
        </div>
    </div>

    <!-- Right side image (Desktop only) -->
    <div class="auth-split-image"></div>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
    <script src="../assets/js/register.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
