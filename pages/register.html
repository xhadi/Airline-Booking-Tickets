<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register - SkyBound</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-container { max-width: 400px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .auth-form { display: flex; flex-direction: column; gap: 1rem; }
        .auth-input { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; }
        .error-msg { color: red; font-size: 0.875rem; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Register</h2>
        <div id="register-error" class="error-msg"></div>
        <form id="register-form" class="auth-form">
            <input type="text" id="first-name" class="auth-input" placeholder="First Name" required>
            <input type="text" id="last-name" class="auth-input" placeholder="Last Name" required>
            <input type="email" id="email" class="auth-input" placeholder="Email" required>
            <input type="password" id="password" class="auth-input" placeholder="Password" required>
            <button type="submit" class="btn-primary">Register</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="../assets/js/register.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
