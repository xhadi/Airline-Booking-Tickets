<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - SkyBound</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-container { max-width: 400px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .auth-form { display: flex; flex-direction: column; gap: 1rem; }
        .auth-input { padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; }
        .error-msg { color: red; font-size: 0.875rem; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Login</h2>
        <div id="login-error" class="error-msg"></div>
        <form id="login-form" class="auth-form">
            <input type="email" id="email" class="auth-input" placeholder="Email" required>
            <input type="password" id="password" class="auth-input" placeholder="Password" required>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('../backend/api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = '../index.html';
                } else {
                    const err = document.getElementById('login-error');
                    err.textContent = data.error || 'Login failed';
                    err.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
