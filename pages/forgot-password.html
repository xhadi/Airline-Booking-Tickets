<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password - SkyBound</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-success-msg {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="auth-page-body">

    <div class="auth-split-form">
        <div class="auth-form-wrapper">
            <a href="../index.html" class="auth-brand">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span>SkyBound</span>
            </a>

            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Verify your identity to reset your password.</p>

            <div id="fp-error" class="auth-error-msg" style="display: none;"></div>
            <div id="fp-success" class="auth-success-msg" style="display: none;"></div>

            <div id="step-email">
                <form id="email-form" class="auth-form">
                    <div class="auth-input-group">
                        <label for="fp-email" class="auth-label">Email address</label>
                        <input type="email" id="fp-email" class="auth-input" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn-auth">Continue</button>
                </form>
            </div>

            <div id="step-answer" style="display: none;">
                <form id="answer-form" class="auth-form">
                    <div class="auth-input-group">
                        <label for="fp-question-display" class="auth-label">Security Question</label>
                        <input type="text" id="fp-question-display" class="auth-input" readonly tabindex="-1">
                    </div>
                    <div class="auth-input-group">
                        <label for="fp-answer" class="auth-label">Your Answer</label>
                        <input type="text" id="fp-answer" class="auth-input" placeholder="Enter your answer" required>
                    </div>
                    <button type="submit" class="btn-auth">Verify</button>
                </form>
            </div>

            <div id="step-reset" style="display: none;">
                <form id="reset-form" class="auth-form">
                    <div class="auth-input-group">
                        <label for="fp-new-password" class="auth-label">New Password</label>
                        <input type="password" id="fp-new-password" class="auth-input" placeholder="••••••••" required minlength="8">
                    </div>
                    <div class="auth-input-group">
                        <label for="fp-confirm-password" class="auth-label">Confirm Password</label>
                        <input type="password" id="fp-confirm-password" class="auth-input" placeholder="••••••••" required minlength="8">
                    </div>
                    <button type="submit" class="btn-auth">Reset Password</button>
                </form>
            </div>

            <p class="auth-footer-link">
                Remember your password? <a href="login.html">Sign in here</a>
            </p>
        </div>
    </div>

    <div class="auth-split-image"></div>

    <script src="../assets/js/forgot-password.js"></script>
</body>
</html>
